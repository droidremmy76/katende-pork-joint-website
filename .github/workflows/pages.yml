name: Deploy Katende website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'src/**'
      - 'public/**'
      - 'pages/**'
      - 'github-pages.package.json'
      - 'vite.pages.config.ts'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "katende-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install lightweight Pages build dependencies
        run: |
          cp github-pages.package.json package.json
          rm -f package-lock.json
          npm install --no-audit --no-fund
      - name: Build exact restaurant UI for GitHub Pages
        run: |
          npm run build:pages
          touch dist-pages/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
